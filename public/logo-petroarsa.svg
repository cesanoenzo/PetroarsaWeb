<!--
  Logo Petroarsa — versión provisoria construida con la paleta institucional
  (verde #0e4d3a + naranja #ec7926) que se usa en las gacetillas.
  REEMPLAZAR por el SVG oficial cuando Marketing lo entregue, manteniendo el
  mismo nombre de archivo y un viewBox de proporción similar.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" role="img" aria-label="Petroarsa S.A.">
  <defs>
    <linearGradient id="pa-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec7926"/>
      <stop offset="55%" stop-color="#d98a2b"/>
      <stop offset="100%" stop-color="#0e4d3a"/>
    </linearGradient>
  </defs>

  <!-- Isotipo: gota de combustible + hoja, las dos actividades de la empresa -->
  <g>
    <path d="M26 4c7.8 9.2 14 17.1 14 25.2C40 39.6 33.7 46 26 46S12 39.6 12 29.2C12 21.1 18.2 13.2 26 4Z" fill="url(#pa-grad)"/>
    <path d="M26 36.5c0-6 3.9-10.4 9.4-11.6-.5 6.5-4.2 10.8-9.4 11.6Z" fill="#ffffff" opacity=".9"/>
    <path d="M26 36.5c0-6-3.9-10.4-9.4-11.6.5 6.5 4.2 10.8 9.4 11.6Z" fill="#ffffff" opacity=".55"/>
  </g>

  <!-- Wordmark -->
  <text x="52" y="37"
        font-family="Archivo Variable, Archivo, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="800" letter-spacing="-0.6">
    <tspan fill="#0e4d3a">PETRO</tspan><tspan fill="#ec7926">ARSA</tspan>
  </text>
</svg>
